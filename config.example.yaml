permissions:
  terminal_read: true
  terminal_input: false

allowed_session_patterns:
  - "claude-*"
  - "codex-*"
  - "agent-*"
  - "test-*"
  - "mesflow-*"
  - "projectflow-*"
  - "terminal-mcp-*"
  - "terminal"

max_capture_lines: 2000
default_tail_lines: 1000

input_policy:
  allowed_session_patterns:
    - "claude-*"
    - "codex-*"
    - "mesflow-*"
    - "projectflow-*"
    - "terminal-mcp-*"
  denied_session_patterns:
    - "root*"
    - "ssh-*"
    - "database-*"
    - "password-*"
    - "secret-*"
    - "prod-shell-*"
  allow_send_text: true
  allow_keys: [Enter, Escape, Up, Down, Left, Right, Tab]
  sensitive_keys_require_confirmation: [C-c, C-d]
  max_text_length: 12000
  allowed_sensitive_commands: []

# Supervisor Loop v1: local detection + a durable event queue only. Disabled
# by default — opt in explicitly. See README.md "Supervisor Loop v1" for the
# full operator guide and the v1/v2 boundary. It never sends input and never
# bypasses terminal_input/input_policy/binding/confirmation/audit; watches
# only ever observe sessions/bindings that already pass the whitelist above.
supervisor:
  enabled: false
  poll_interval_seconds: 20   # minimum enforced: 5 (avoids an accidental hot loop)
  idle_threshold_seconds: 45
  max_iterations: 20          # a watch auto-disables itself after this many polls
  same_failure_limit: 2       # ...or after this many *identical* consecutive errors
  event_retention: 500        # oldest events beyond this count are pruned
  watched_session_patterns: []  # e.g. ["claude-*"] — matched against currently allowed sessions each poll
  watched_bindings: []          # e.g. ["mesflow-dev"] — must already exist via terminal_bind
  # v2 (decision/send layer) global kill switch. supervisor2_execute_send
  # refuses to send anything while this is false, regardless of any
  # per-watch policy_mode (which itself defaults to observe_only per watch).
  # Both gates must be explicitly opted into before v2 can ever send text.
  v2_enabled: false

# Dashboard: mutations_enabled (default true) is a separate, additional
# on/off switch for the dashboard's own POST routes (session input,
# supervisor ack, supervisor2 pause) -- set it false to publish a
# strictly read-only dashboard regardless of permissions/input_policy.
# cloudflare_access_team_domain/audience are optional and OFF by default
# (no-op unless both are set): if this dashboard is published through a
# Cloudflare Tunnel hostname that also has a Cloudflare Access
# application in front of it, set these to the Access team's domain
# (from https://<team>.cloudflareaccess.com) and the Access
# Application's AUD tag (Zero Trust dashboard -> Access -> Applications
# -> your app -> Application Audience (AUD) Tag) so mutation routes
# cryptographically verify the Cf-Access-Jwt-Assertion header instead of
# trusting the edge redirect alone. allowed_origins adds extra trusted
# Origins for the always-on CSRF check beyond the request's own Host.
# dashboard:
#   mutations_enabled: true
#   cloudflare_access_team_domain: "your-team.cloudflareaccess.com"
#   cloudflare_access_audience: "the-access-application-aud-tag"
#   allowed_origins: []
#   web_terminal_enabled: false   # xterm.js "Open Terminal" over a WebSocket

# Session lifecycle: create/detach/delete real tmux sessions from the
# dashboard's "Tạo session"/"Tách"/"Xóa session" controls and from the
# terminal_create_session/_detach_session/_delete_session MCP tools.
# Disabled by default -- same opt-in posture as terminal_input, since this
# creates real processes rather than only observing existing ones.
# allowed_cwd_roots: absolute paths a requested working_directory must
# resolve inside of (symlinks followed) -- empty/omitted falls back to
# this server process's own home directory only, never "/". protected_
# sessions: names that can never be deleted through this feature --
# "terminal-mcp" is always included even if omitted here. launch_commands:
# agent_type -> the exact literal binary run as the session's initial
# command for "claude"/"codex" (never anything a caller supplies as
# text) -- "shell" always starts the session's plain default shell.
# session_lifecycle:
#   enabled: false
#   allowed_cwd_roots: []
#   protected_sessions: [terminal-mcp]
#   launch_commands:
#     claude: claude
#     codex: codex
#   create_ready_timeout_seconds: 5
#   default_grant_mode: none   # none | read | read_send

# Session Knowledge Store: captures every session's REAL (redacted) output
# into a durable, searchable record (session_knowledge.py) for search/
# timeline/recovery -- terminal_knowledge_search/_timeline/_recover/
# _checkpoint (MCP tools + dashboard History panel). Disabled by default:
# capture has a real side effect on the actual tmux pane (`pipe-pane`,
# for Linux/tmux sessions) for EVERY session this process's own reconcile
# pass sees, including ones this config had nothing to do with creating --
# only ever captures a session whose cwd resolves inside session_
# lifecycle.allowed_cwd_roots above (a second, independent safety layer),
# but that alone is not a substitute for deliberately opting in here.
# session_knowledge:
#   enabled: false

# Periodic SQLite maintenance: retention pruning (audit.db's input_audit/
# idempotent_sends, supervisor.db's supervisor_actions -- supervisor_events
# already has its own event_retention above, pruned every v1 poll cycle)
# and WAL checkpointing, on a background interval independent of whether
# Supervisor Loop v1 is enabled (audit.db accumulates from any
# terminal_send_text/_keys call regardless). All optional; these are the
# defaults.
# maintenance:
#   interval_seconds: 1800
#   audit_retention: 20000
#   action_retention: 5000
#   idempotency_key_retention_days: 30

# Multi-node session management (docs/multi-node.md) -- optional, empty
# by default (today's single-node deployment is unaffected by this
# section existing or not). overload_thresholds/heartbeat control the
# fleet-health heuristic every node (including the local one) is judged
# by; remote declares worker nodes (e.g. a second machine running
# `terminal-node-agent`, see deploy/install-node-agent.sh) to auto-
# register at startup. A remote node's shared secret NEVER lives in this
# file -- token_env only names the environment variable it's read from.
# nodes:
#   overload_thresholds:
#     ram_busy_percent: 80
#     ram_overloaded_percent: 90
#     swap_overloaded_percent: 20
#     cpu_busy_percent: 85
#     cpu_overloaded_percent: 95
#     sustained_seconds: 300
#     load_factor_busy: 1.2
#     disk_free_overloaded_percent: 10
#     smoothing_alpha: 0.4
#   heartbeat:
#     degraded_after_seconds: 60
#     offline_after_seconds: 180
#   remote:
#     - node_id: m910
#       display_name: "M910 Workstation"
#       hostname: "m910.local"
#       endpoint: "http://192.168.1.50:8790"
#       token_env: TERMINAL_MCP_NODE_TOKEN_M910
#       max_sessions: 20
#       timeout_seconds: 10.0
