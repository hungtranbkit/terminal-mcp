permissions:
  terminal_read: true
  terminal_input: false

allowed_session_patterns:
  - "claude-*"
  - "codex-*"
  - "agent-*"
  - "test-*"
  - "mesflow-*"
  - "projectflow-*"
  - "terminal-mcp-*"
  - "terminal"

max_capture_lines: 2000
default_tail_lines: 1000

input_policy:
  allowed_session_patterns:
    - "claude-*"
    - "codex-*"
    - "mesflow-*"
    - "projectflow-*"
    - "terminal-mcp-*"
  denied_session_patterns:
    - "root*"
    - "ssh-*"
    - "database-*"
    - "password-*"
    - "secret-*"
    - "prod-shell-*"
  allow_send_text: true
  allow_keys: [Enter, Escape, Up, Down, Left, Right, Tab]
  sensitive_keys_require_confirmation: [C-c, C-d]
  max_text_length: 12000
  allowed_sensitive_commands: []

# Supervisor Loop v1: local detection + a durable event queue only. Disabled
# by default — opt in explicitly. See README.md "Supervisor Loop v1" for the
# full operator guide and the v1/v2 boundary. It never sends input and never
# bypasses terminal_input/input_policy/binding/confirmation/audit; watches
# only ever observe sessions/bindings that already pass the whitelist above.
supervisor:
  enabled: false
  poll_interval_seconds: 20   # minimum enforced: 5 (avoids an accidental hot loop)
  idle_threshold_seconds: 45
  max_iterations: 20          # a watch auto-disables itself after this many polls
  same_failure_limit: 2       # ...or after this many *identical* consecutive errors
  event_retention: 500        # oldest events beyond this count are pruned
  watched_session_patterns: []  # e.g. ["claude-*"] — matched against currently allowed sessions each poll
  watched_bindings: []          # e.g. ["mesflow-dev"] — must already exist via terminal_bind
  # v2 (decision/send layer) global kill switch. supervisor2_execute_send
  # refuses to send anything while this is false, regardless of any
  # per-watch policy_mode (which itself defaults to observe_only per watch).
  # Both gates must be explicitly opted into before v2 can ever send text.
  v2_enabled: false

# Dashboard: mutations_enabled (default true) is a separate, additional
# on/off switch for the dashboard's own POST routes (session input,
# supervisor ack, supervisor2 pause) -- set it false to publish a
# strictly read-only dashboard regardless of permissions/input_policy.
# cloudflare_access_team_domain/audience are optional and OFF by default
# (no-op unless both are set): if this dashboard is published through a
# Cloudflare Tunnel hostname that also has a Cloudflare Access
# application in front of it, set these to the Access team's domain
# (from https://<team>.cloudflareaccess.com) and the Access
# Application's AUD tag (Zero Trust dashboard -> Access -> Applications
# -> your app -> Application Audience (AUD) Tag) so mutation routes
# cryptographically verify the Cf-Access-Jwt-Assertion header instead of
# trusting the edge redirect alone. allowed_origins adds extra trusted
# Origins for the always-on CSRF check beyond the request's own Host.
# dashboard:
#   mutations_enabled: true
#   cloudflare_access_team_domain: "your-team.cloudflareaccess.com"
#   cloudflare_access_audience: "the-access-application-aud-tag"
#   allowed_origins: []
#   web_terminal_enabled: false   # xterm.js "Open Terminal" over a WebSocket

# Session lifecycle: create/detach/delete real tmux sessions from the
# dashboard's "Tạo session"/"Tách"/"Xóa session" controls and from the
# terminal_create_session/_detach_session/_delete_session MCP tools.
# Disabled by default -- same opt-in posture as terminal_input, since this
# creates real processes rather than only observing existing ones.
# allowed_cwd_roots: absolute paths a requested working_directory must
# resolve inside of (symlinks followed) -- empty/omitted falls back to
# this server process's own home directory only, never "/". protected_
# sessions: names that can never be deleted through this feature --
# "terminal-mcp" is always included even if omitted here. launch_commands:
# agent_type -> the exact literal binary run as the session's initial
# command for "claude"/"codex" (never anything a caller supplies as
# text) -- "shell" always starts the session's plain default shell.
# session_lifecycle:
#   enabled: false
#   allowed_cwd_roots: []
#   protected_sessions: [terminal-mcp]
#   launch_commands:
#     claude: claude
#     codex: codex
#   create_ready_timeout_seconds: 5
#   default_grant_mode: none   # none | read | read_send

# Session Knowledge Store: captures every session's REAL (redacted) output
# into a durable, searchable record (session_knowledge.py) for search/
# timeline/recovery -- terminal_knowledge_search/_timeline/_recover/
# _checkpoint (MCP tools + dashboard History panel). Disabled by default:
# capture has a real side effect on the actual tmux pane (`pipe-pane`,
# for Linux/tmux sessions) for EVERY session this process's own reconcile
# pass sees, including ones this config had nothing to do with creating --
# only ever captures a session whose cwd resolves inside session_
# lifecycle.allowed_cwd_roots above (a second, independent safety layer),
# but that alone is not a substitute for deliberately opting in here.
# session_knowledge:
#   enabled: false

# Periodic SQLite maintenance: retention pruning (audit.db's input_audit/
# idempotent_sends, supervisor.db's supervisor_actions -- supervisor_events
# already has its own event_retention above, pruned every v1 poll cycle)
# and WAL checkpointing, on a background interval independent of whether
# Supervisor Loop v1 is enabled (audit.db accumulates from any
# terminal_send_text/_keys call regardless). All optional; these are the
# defaults.
# maintenance:
#   interval_seconds: 1800
#   audit_retention: 20000
#   action_retention: 5000
#   idempotency_key_retention_days: 30

# Multi-node session management (docs/multi-node.md) -- optional, empty
# by default (today's single-node deployment is unaffected by this
# section existing or not). overload_thresholds/heartbeat control the
# fleet-health heuristic every node (including the local one) is judged
# by; remote declares worker nodes (e.g. a second machine running
# `terminal-node-agent`, see deploy/install-node-agent.sh) to auto-
# register at startup. A remote node's shared secret NEVER lives in this
# file -- token_env only names the environment variable it's read from.
# nodes:
#   overload_thresholds:
#     ram_busy_percent: 80
#     ram_overloaded_percent: 90
#     swap_overloaded_percent: 20
#     cpu_busy_percent: 85
#     cpu_overloaded_percent: 95
#     sustained_seconds: 300
#     load_factor_busy: 1.2
#     disk_free_overloaded_percent: 10
#     smoothing_alpha: 0.4
#   heartbeat:
#     degraded_after_seconds: 60
#     offline_after_seconds: 180
#   health:
#     enabled: true
#     probe_interval_seconds: 20
#     probe_timeout_seconds: 3       # must remain below 5 seconds
#     execution_down_after_failures: 2
#     backoff_base_seconds: 5
#     backoff_max_seconds: 300
#     backoff_jitter_ratio: 0.2
#   remote:
#     - node_id: m910
#       display_name: "M910 Workstation"
#       hostname: "m910.local"
#       endpoint: "http://192.168.1.50:8790"
#       token_env: TERMINAL_MCP_NODE_TOKEN_M910
#       max_sessions: 20
#       timeout_seconds: 10.0
#       # Off by default. This only requests a graceful agent stop; the
#       # existing service supervisor owns the single replacement process.
#       self_heal_enabled: false
#       self_heal_action: none       # or graceful_agent_restart
#
#   # Self-service node onboarding -- Dashboard > Nodes > "+ Add Node".
#   # See docs/windows-node-onboarding.md. Every field below is optional:
#   # with none of it set, a Windows machine still enrols over its LAN
#   # address, with a manual `tailscale up` and no rescue tunnel, and the
#   # form says so up front rather than generating an installer that
#   # cannot work.
#   onboarding:
#     enabled: true
#     enrollment_ttl_seconds: 900        # 60..86400; codes are single-use
#     # What the generated installer calls back to. Empty (the default) =
#     # derive it from this controller's own tailnet address, else from the
#     # request's Host header. Set it explicitly behind a proxy that
#     # rewrites Host.
#     controller_url: "http://100.100.0.1:8766"
#     # PUBLIC deployments: the machine-facing origin, pinned rather than
#     # inferred. A machine being onboarded has no Cloudflare Access session
#     # and cannot get one, so it must never be handed the Access-gated
#     # Dashboard hostname -- Access answers its enrollment POST with a
#     # login page, which is a successful HTTP response carrying no
#     # bootstrap config. Setting this makes it the first callback
#     # candidate AND removes the browser's Host from the list entirely.
#     # The operator's Dashboard is unaffected and keeps its own hostname.
#     # An origin only: scheme://host[:port], never a path.
#     # Pair it with deploy/cloudflare/bootstrap-ingress.template.yml.
#     bootstrap_origin: "https://terminal-bootstrap.example.net"
#     # The PUBLIC key installed into the new node's
#     # administrators_authorized_keys so this controller can SSH in.
#     # Defaults to ~/.ssh/id_ed25519.pub. A private key here is REFUSED.
#     controller_ssh_public_key_file: "/home/you/.ssh/id_ed25519.pub"
#     agent_port: 8790
#     heartbeat_interval_seconds: 30
#     # Which sources the node opens inbound TCP 22 to. Default is
#     # Tailscale's CGNAT range -- deliberately not "any", so a laptop that
#     # later joins a cafe network is not serving sshd to it.
#     ssh_firewall_cidrs: ["100.64.0.0/10"]
#     tailscale:
#       enabled: true
#       # The NAME of the env var holding an auth key, never the key. An
#       # inline `auth_key:` here is refused at startup. Unset => the
#       # installer prints an interactive `tailscale up` step instead,
#       # which is the posture with no reusable secret in flight.
#       auth_key_env: TERMINAL_MCP_TAILSCALE_AUTH_KEY
#       tags: []
#       unattended: true
#       login_server: ""                 # Headscale/self-hosted, if any
#     # Reverse-SSH rescue tunnel (rescue_gateway.py). OFF until you have
#     # actually stood a gateway up -- see the doc's "Standing up a rescue
#     # gateway". gateway_host_key is one PUBLIC known_hosts line
#     # (`ssh-keyscan -t ed25519 <host>`); there is no field for a private
#     # key because the NODE generates its own and never shares it.
#     rescue:
#       enabled: false
#       gateway_host: "gw.example.net"
#       gateway_port: 22
#       gateway_user: "tunnel"
#       gateway_host_key: "gw.example.net ssh-ed25519 AAAA..."
#       port_range_start: 22000
#       port_range_end: 22999
#       keepalive_interval_seconds: 30
#       keepalive_count_max: 3
#       retry_seconds: 15

# Read-only repository access for the repo_* MCP tools (repo_read.py /
# repo_service.py) -- what lets an external agent (ChatGPT over MCP) read
# Git and source directly instead of asking a Claude session to paste
# file contents back.
#
# ON by default, unlike session_lifecycle/work: those gate capabilities
# that CREATE something (a real process, an auto-dispatched prompt), while
# this one only reads and has no write primitive -- there is deliberately
# no repo_write/repo_checkout/repo_commit tool, and every mutating git
# subcommand is refused by repo_read.READ_ONLY_GIT_SUBCOMMANDS. The real
# boundary is allowed_roots, not the flag.
repo_read:
  enabled: true

  # Absolute paths a repository must resolve (symlinks followed) inside
  # of. LEAVE EMPTY to reuse session_lifecycle.allowed_cwd_roots -- the
  # allowlist you have already curated for "where a session may live",
  # which is very nearly the set of repos worth reading. With both empty
  # the effective root is this server's own home directory; never "/",
  # which the loader refuses outright.
  allowed_roots: []
    # - /home/dell/workspace

  # Output caps. A caller cannot argue past these (asking for
  # max_bytes=10000000 against a 256000 policy still yields 256000), and
  # truncation is always reported as `truncated: true`, never silent.
  # An out-of-range value here is a load-time error, not a silent clamp.
  max_bytes: 256000          # per repo_read call
  max_lines: 2000            # per repo_read call
  max_results: 200           # per repo_search call
  max_tree_entries: 2000     # per repo_tree call
  max_tree_depth: 6          # per repo_tree call
  max_log_entries: 200       # per repo_log call
  max_diff_bytes: 400000     # per repo_diff / repo_show_commit patch
  timeout_seconds: 15        # per git invocation

  # ADDITIVE ONLY. Credential files are already denied by a built-in list
  # (.env*, *.pem, *.key, id_*, .git-credentials, .npmrc, *credentials*,
  # .git/, .ssh/, ... -- see repo_read.SECRET_PATH_GLOBS), and there is
  # deliberately NO key that removes one, so nothing configured here can
  # reopen a path the code closed. Use it to deny MORE for your own repo.
  extra_secret_globs: []
    # - "*.backup.sql"
    # - "deploy/production-*.yaml"

# -- Notes / Ideas ("Ghi chú / Ý tưởng") -------------------------------------
# The cross-project note store ChatGPT writes into when the user says "lưu
# lại" (MCP tools note_create/note_search/...), browsable at /dashboard/notes.
# Defaults are ON and need no configuration at all: the DB lands beside every
# other store (~/.local/state/terminal-mcp/notes.db) and images go next to it
# in notes_attachments/YYYY/MM/. Nothing is written until a note is created.
#
# notes:
#   enabled: true
#   # Application-layer auth on /dashboard/notes and every Notes API route.
#   # ON by default -- Cloudflare Access at the edge is NOT sufficient, because
#   # cloudflared connects over loopback and tunnel traffic is therefore
#   # indistinguishable from local traffic once it reaches this process.
#   # Satisfied by a webauth session cookie (the /login path) OR a verified
#   # Cloudflare Access assertion when dashboard.cloudflare_access_team_domain
#   # and _audience are configured. No third mechanism exists. Set false only
#   # for a loopback-only single-user box where logging in is pure friction.
#   require_auth: true
#   # Empty means "beside the notes DB" -- set it to put the (potentially
#   # large) image directory on a different disk. Backups must cover BOTH
#   # this directory and notes.db; see docs/notes.md.
#   attachments_dir: ""
#   max_attachment_bytes: 10485760          # 10 MiB
#   # Only types the server can content-sniff AND serve safely. A file whose
#   # real bytes are not one of these is refused even if it is named .png.
#   allowed_mime_types: ["image/png", "image/jpeg", "image/webp", "image/gif"]
#   # EMPTY BY DEFAULT, and that is the security posture: with no root here
#   # the note_add_attachment(source_path=...) transport is refused outright
#   # (ATTACHMENT_SOURCE_DISABLED) and only in-band base64 / the dashboard's
#   # own upload form can add images. Adding a root grants this store
#   # permission to read files from exactly that subtree -- nothing wider.
#   # Absolute paths only; symlinks are resolved before the check, so a link
#   # inside a root pointing outside it does not pass.
#   attachment_source_roots:
#     - "~/Pictures/Screenshots"
#     - "/tmp/chatgpt-drops"

# -- Project compact workflows ----------------------------------------------
