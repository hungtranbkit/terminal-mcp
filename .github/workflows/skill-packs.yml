name: Shared skill pack gates
on:
  pull_request:
    paths:
      - 'terminal_mcp/skill_packs.py'
      - 'terminal_mcp/node_profile.py'
      - 'deploy/skill-packs/**'
      - 'examples/ux-ui-skill-pack/**'
      - 'tests/test_skill_packs*.py'
      - '.github/workflows/skill-packs.yml'
  workflow_dispatch:
jobs:
  unit:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -e '.[test]'
      - run: python -m pytest -q tests/test_skill_packs.py
  real-kit:
    # Installs the pinned upstream kit for real and runs every gate on the
    # clean (must PASS) and broken (must FAIL) fixtures.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -e '.[test]'
      - run: terminal-mcp-skill-packs sync
        env:
          CLAUDE_SKILLS_HOME: ${{ runner.temp }}/claude-skills
          CODEX_HOME: ${{ runner.temp }}/codex
      - run: npx --yes playwright@1.63.0 install-deps chromium
      - run: terminal-mcp-skill-packs status
      - run: python -m pytest -q tests/test_skill_packs_e2e.py
        env:
          TERMINAL_MCP_SKILL_PACK_E2E: '1'
