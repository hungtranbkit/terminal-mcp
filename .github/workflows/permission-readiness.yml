name: Agent permission readiness checks

on:
  pull_request:
    paths:
      - 'terminal_mcp/adapters.py'
      - 'terminal_mcp/status.py'
      - 'terminal_mcp/lifecycle.py'
      - 'terminal_mcp/core.py'
      - 'terminal_mcp/controller.py'
      - 'tests/test_move_session.py'
      - 'tests/test_codex_startup_navigation.py'
      - 'tests/test_session_lifecycle.py'
      - '.github/workflows/permission-readiness.yml'
  workflow_dispatch:

jobs:
  permission-contract:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y tmux
      - if: runner.os == 'macOS'
        run: brew install tmux
      - run: python -m pip install -e '.[test]'
      - run: >-
          python -m pytest -q tests/test_codex_startup_navigation.py
          tests/test_session_lifecycle.py tests/test_status.py tests/test_adapters.py
          tests/test_issue52_supervised_dispatch.py tests/test_move_session.py
