name: Submit invariant checks

on:
  pull_request:
    paths:
      - "terminal_mcp/core.py"
      - "terminal_mcp/tmux.py"
      - "tests/test_codex_direct_dispatch.py"
      - "tests/test_codex_paste_settle.py"
      - "tests/fixtures/codex_bracketed_paste.py"
      - "terminal_mcp/delivery_gate.py"
      - "terminal_mcp/compact_tools.py"
      - "tests/test_delivery_gate.py"
      - "tests/test_compact_tools.py"
      - "tests/test_submit_acceptance_p1.py"
      - ".github/workflows/submit-invariant.yml"
  workflow_dispatch:

jobs:
  targeted:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - run: sudo apt-get update && sudo apt-get install -y tmux
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[test]"
      - run: python -m pytest -q tests/test_delivery_gate.py tests/test_compact_tools.py tests/test_submit_acceptance_p1.py tests/test_codex_paste_settle.py tests/test_verified_submit_watchdog.py tests/test_submit_config_wiring.py tests/test_codex_direct_dispatch.py tests/test_direct_contract.py tests/test_node_client_permissions.py
