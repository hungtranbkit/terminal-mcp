name: Windows setup executable

on:
  pull_request:
    paths:
      - "helper/**"
      - "deploy/install-node-agent.ps1"
      - ".github/workflows/windows-setup.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: helper
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: helper/go.mod
          cache-dependency-path: helper/go.sum
      - name: Test helper
        run: go test ./...
      - name: Build reproducible Windows executable
        shell: pwsh
        run: |
          $version = "0.2.0-dev"
          $sha = git rev-parse --short HEAD
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          go build -trimpath -buildvcs=false -ldflags "-s -w -X main.Version=$version -X main.BuildSHA=$sha -X main.Signed=false" -o dist/TerminalMCP-Setup.exe ./cmd/terminal-mcp-bootstrap
          $hash = (Get-FileHash dist/TerminalMCP-Setup.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  TerminalMCP-Setup.exe" | Set-Content -Encoding ascii dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: TerminalMCP-Setup-windows-x64
          path: |
            helper/dist/TerminalMCP-Setup.exe
            helper/dist/SHA256SUMS.txt
          if-no-files-found: error
