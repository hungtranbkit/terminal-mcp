name: Unified Memory gates
on:
  pull_request:
    paths:
      - 'terminal_mcp/**'
      - 'tests/test_*memory*.py'
      - 'scripts/stage_unified_memory.py'
      - '.github/workflows/unified-memory.yml'
  workflow_dispatch:
jobs:
  memory:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y tmux
      - if: runner.os == 'macOS'
        run: brew install tmux
      - run: python -m pip install -e '.[test]'
      - run: python -m pytest -q tests/test_unified_memory.py tests/test_unified_memory_http.py tests/test_memory_projection.py tests/test_memory_runtime.py
      - run: python scripts/stage_unified_memory.py
