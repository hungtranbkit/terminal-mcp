name: Compact terminal turn checks

on:
  pull_request:
    paths:
      - "terminal_mcp/compact_tools.py"
      - "terminal_mcp/mcp_app.py"
      - "terminal_mcp/browser_compat.py"
      - "terminal_mcp/browser_gateway.py"
      - "tests/test_compact_tools.py"
      - "tests/test_compact_turn_actions.py"
      - "tests/test_compact_delete_confirmation.py"
      - "tests/test_cached_browser_surface.py"
      - "tests/test_browser_gateway.py"
      - "tests/test_mcp_app_wiring.py"
      - ".github/workflows/compact-turn.yml"
  workflow_dispatch:

jobs:
  targeted:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[test]"
      - run: >-
          python -m pytest -q tests/test_compact_tools.py
          tests/test_compact_turn_actions.py tests/test_compact_delete_confirmation.py
          tests/test_cached_browser_surface.py tests/test_browser_gateway.py
          tests/test_mcp_app_wiring.py
