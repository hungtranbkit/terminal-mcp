name: Compact terminal turn checks

on:
  pull_request:
    paths:
      - "terminal_mcp/compact_tools.py"
      - "terminal_mcp/mcp_app.py"
      - "terminal_mcp/orchestration_policy.py"
      - "tests/test_compact_tools.py"
      - "tests/test_compact_turn_actions.py"
      - "tests/test_direct_contract.py"
      - "tests/test_queue_persist_mcp_tools.py"
      - "tests/test_one_call_start.py"
      - "tests/test_orchestration_policy.py"
      - "docs/CHATGPT_ORCHESTRATION_POLICY.md"
      - ".github/workflows/compact-turn.yml"
  workflow_dispatch:

jobs:
  targeted:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[test]"
      - run: >-
          python -m pytest -q tests/test_compact_tools.py
          tests/test_compact_turn_actions.py tests/test_direct_contract.py
          tests/test_queue_persist_mcp_tools.py tests/test_one_call_start.py
          tests/test_orchestration_policy.py
