permissions:
  terminal_read: true
  terminal_input: true

allowed_session_patterns:
  - "claude-*"
  - "codex-*"
  - "agent-*"
  - "test-*"
  - "mesflow-*"
  - "projectflow-*"
  - "terminal-mcp-*"
  - "terminal-mcp"
  - "terminal"

max_capture_lines: 2000
default_tail_lines: 1000

input_policy:
  allowed_session_patterns:
    - "claude-*"
    - "codex-*"
    - "mesflow-*"
    - "projectflow-*"
    - "terminal-mcp-*"
    - "terminal-mcp"
    - "terminal"
  denied_session_patterns:
    - "root*"
    - "ssh-*"
    - "database-*"
    - "password-*"
    - "secret-*"
    - "prod-shell-*"
  allow_send_text: true
  allow_keys: [Enter, Escape, Up, Down, Left, Right, Tab]
  sensitive_keys_require_confirmation: [C-c, C-d]
  max_text_length: 12000
  allowed_sensitive_commands: []

# Supervisor Loop v1 — detection + durable event queue only (see README.md
# "Supervisor Loop v1"). Conservative on enable: watched_session_patterns/
# watched_bindings stay empty, so nothing is actually watched until an
# explicit supervisor_watch call — enabling this alone changes no observed
# behavior, it only starts the background poll thread (idle, watching
# nothing) and makes the supervisor_* tools' background timer live.
supervisor:
  enabled: true
  # v2 (decision/send layer) global kill switch: re-enabled after the full
  # P0/P0.5 hardening pass (identity pinning, per-pane lock, idempotency
  # keys, revision CAS, confirmed delivery, structured completion
  # verification/nonce/trusted verifier hooks, and the stale-policy-on-
  # reused-name fix immediately preceding this commit) plus a live
  # re-verification of every gate against a disposable production session
  # -- see that commit's message for the checklist and evidence. This flag
  # is still ONLY the global kill switch: flipping it does not itself
  # enable any auto-send anywhere -- that still requires an operator to
  # explicitly call supervisor2_set_policy(policy_mode="approved_auto_
  # continue", ...) on a specific watch, which no watch has by default
  # (observe_only) and no watch currently has (this environment's
  # supervisor.db carries no watches/policies as of this change).
  v2_enabled: true
