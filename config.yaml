permissions:
  terminal_read: true
  terminal_input: true

allowed_session_patterns:
  - "claude-*"
  - "codex-*"
  - "agent-*"
  - "test-*"
  - "mesflow-*"
  - "projectflow-*"
  - "terminal-mcp-*"
  - "terminal-mcp"
  - "terminal"

max_capture_lines: 2000
default_tail_lines: 1000

input_policy:
  allowed_session_patterns:
    - "claude-*"
    - "codex-*"
    - "mesflow-*"
    - "projectflow-*"
    - "terminal-mcp-*"
    - "terminal-mcp"
    - "terminal"
  denied_session_patterns:
    - "root*"
    - "ssh-*"
    - "database-*"
    - "password-*"
    - "secret-*"
    - "prod-shell-*"
  allow_send_text: true
  allow_keys: [Enter, Escape, Up, Down, Left, Right, Tab]
  sensitive_keys_require_confirmation: [C-c, C-d]
  max_text_length: 12000
  allowed_sensitive_commands: []

# Supervisor Loop v1 — detection + durable event queue only (see README.md
# "Supervisor Loop v1"). Conservative on enable: watched_session_patterns/
# watched_bindings stay empty, so nothing is actually watched until an
# explicit supervisor_watch call — enabling this alone changes no observed
# behavior, it only starts the background poll thread (idle, watching
# nothing) and makes the supervisor_* tools' background timer live.
supervisor:
  enabled: true
  # v2 (decision/send layer) global kill switch: OFF again pending the P0
  # hardening pass (identity pinning, per-pane lock, idempotency keys,
  # revision CAS, confirmed delivery, structured completion verification --
  # see the P0 hardening commits). v2 detection/observe_only/suggest_only
  # review still work with this off; only supervisor2_execute_send is
  # gated by it, so no watch can auto-send while this pass is in progress
  # even if a per-watch policy were set to approved_auto_continue.
  v2_enabled: false
