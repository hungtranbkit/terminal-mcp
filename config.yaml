permissions:
  terminal_read: true
  terminal_input: true

allowed_session_patterns:
  - "claude-*"
  - "codex-*"
  - "agent-*"
  - "test-*"
  - "mesflow-*"
  - "projectflow-*"
  - "terminal-mcp-*"
  - "terminal-mcp"
  - "terminal"

max_capture_lines: 2000
default_tail_lines: 1000

input_policy:
  allowed_session_patterns:
    - "claude-*"
    - "codex-*"
    - "mesflow-*"
    - "projectflow-*"
    - "terminal-mcp-*"
    - "terminal-mcp"
    - "terminal"
  denied_session_patterns:
    - "root*"
    - "ssh-*"
    - "database-*"
    - "password-*"
    - "secret-*"
    - "prod-shell-*"
  allow_send_text: true
  allow_keys: [Enter, Escape, Up, Down, Left, Right, Tab]
  sensitive_keys_require_confirmation: [C-c, C-d]
  max_text_length: 12000
  allowed_sensitive_commands: []

# Supervisor Loop v1 — detection + durable event queue only (see README.md
# "Supervisor Loop v1"). Conservative on enable: watched_session_patterns/
# watched_bindings stay empty, so nothing is actually watched until an
# explicit supervisor_watch call — enabling this alone changes no observed
# behavior, it only starts the background poll thread (idle, watching
# nothing) and makes the supervisor_* tools' background timer live.
supervisor:
  enabled: true
  # v2 (decision/send layer) global kill switch: re-enabled after the full
  # P0/P0.5 hardening pass (identity pinning, per-pane lock, idempotency
  # keys, revision CAS, confirmed delivery, structured completion
  # verification/nonce/trusted verifier hooks, and the stale-policy-on-
  # reused-name fix immediately preceding this commit) plus a live
  # re-verification of every gate against a disposable production session
  # -- see that commit's message for the checklist and evidence. This flag
  # is still ONLY the global kill switch: flipping it does not itself
  # enable any auto-send anywhere -- that still requires an operator to
  # explicitly call supervisor2_set_policy(policy_mode="approved_auto_
  # continue", ...) on a specific watch, which no watch has by default
  # (observe_only) and no watch currently has (this environment's
  # supervisor.db carries no watches/policies as of this change).
  v2_enabled: true

# P1 hardening item #2: this deployment's dashboard hostname
# (terminal-dashboard.mesflow.net) sits behind a real Cloudflare Access
# application (confirmed live: an unauthenticated request 302s to
# falling-field-15e3.cloudflareaccess.com's login page) -- these two
# values let the app itself cryptographically verify the Cf-Access-Jwt-
# Assertion header Access attaches once a browser has logged in, instead
# of trusting the edge redirect alone. See cf_access.py.
dashboard:
  cloudflare_access_team_domain: "falling-field-15e3.cloudflareaccess.com"
  cloudflare_access_audience: "2c67fa84f87699170bd7b68a9591e58a586fab4e2689932118a02a662bd28c32"
  # Web terminal (xterm.js over a WebSocket, attaching a browser directly
  # to an existing tmux session's real pty -- webterm.py/dashboard.py's
  # "Open Terminal" button). Opt-in, same posture as session_lifecycle.
  web_terminal_enabled: true

# Session lifecycle: create/detach/delete real tmux sessions, from the
# dashboard's "Tạo session"/"Tách"/"Xóa session" controls and from the
# terminal_create_session/_detach_session/_delete_session MCP tools
# (e.g. a ChatGPT client asking to open a new Claude/Codex session). See
# README's "Create an agent tmux session" for the same two launcher
# binaries referenced below -- this only lets an authorized caller start
# them under a name/cwd of their choosing, never any other command.
# allowed_cwd_roots is this host's actual workspace layout; protected_
# sessions adds this deployment's other real, attended, must-never-be-
# deleted-from-here sessions on top of the always-protected
# "terminal-mcp" (see permissions/audit history for why each is listed).
session_lifecycle:
  enabled: true
  allowed_cwd_roots:
    - /home/dell/workspace
    - /home/dell
  protected_sessions:
    - terminal-mcp
    - codex-main
    - projectflow-main
    - promptflow
    - mesflow
    - nail
    - server-hub
  launch_commands:
    claude: claude
    codex: codex
  create_ready_timeout_seconds: 6
  default_grant_mode: none

# Session Knowledge Store: captures every session's REAL output (redacted)
# into a searchable, durable record (session_knowledge.py) -- disabled by
# default (see SessionKnowledgeConfig's own docstring for why: capture has
# a real side effect on the actual tmux pane). Explicitly opted in here so
# real, currently-attended sessions above (terminal-mcp, codex-main,
# projectflow-main, promptflow, mesflow, nail, server-hub) get searchable
# history/recovery going forward -- capture is a pure output tap via tmux's
# own pipe-pane, never touches keystroke input or the session's own
# process, so an attached human is unaffected.
session_knowledge:
  enabled: true

# Multi-node: real Windows worker node (dell-5530, tranv@192.168.1.250),
# bootstrapped live over SSH -- see docs/multi-node.md's own "LAN
# discovery + remote connect" and "Windows node support" sections.
nodes:
  remote:
    - node_id: dell-5530
      display_name: "dell-5530 (Windows)"
      hostname: "192.168.1.250"
      endpoint: "http://192.168.1.250:8790"
      token_env: TERMINAL_MCP_NODE_TOKEN_DELL_5530
    # Linux worker node (M910, mesflow@192.168.1.109 / thinkcentre SSH
    # alias) -- installed via deploy/install-node-agent.sh, running as
    # a systemd --user service under the mesflow account.
    - node_id: m910
      display_name: "m910 (Linux)"
      hostname: "192.168.1.109"
      endpoint: "http://192.168.1.109:8790"
      token_env: TERMINAL_MCP_NODE_TOKEN_M910
    # macOS worker node (rumraisin's MacBook Pro, rumraisin@192.168.1.138
    # LAN / rumraisin@100.104.209.93 Tailscale) -- installed via
    # deploy/install-node-agent-macos.sh, running as a per-user
    # LaunchAgent (~/Library/LaunchAgents, macOS's own equivalent of
    # `systemctl --user`). Clamshell mode (lid closed, still running) is
    # kept alive by AC power + an external display always connected --
    # both conditions the user confirmed they keep permanently.
    - node_id: macbook
      display_name: "macbook (macOS)"
      hostname: "Rums-MacBook-Pro.local"
      endpoint: "http://192.168.1.138:8790"
      token_env: TERMINAL_MCP_NODE_TOKEN_MACBOOK
