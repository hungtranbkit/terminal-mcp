[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "terminal-mcp"
dynamic = ["version"]
description = "A whitelist-only STDIO and loopback HTTP MCP server for observing tmux sessions"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "mcp>=2.1,<3",
  "PyYAML>=6,<7",
  "PyJWT[crypto]>=2,<3",
  "uvicorn>=0.30,<1",
  "anyio>=4,<5",
  # Only needed for uvicorn's WebSocket upgrade support (the web terminal
  # feature, webterm.py/dashboard.py's /dashboard/ws/terminal +
  # webauth_dashboard.py's /app/ws/terminal) -- uvicorn has no built-in
  # WebSocket implementation of its own and silently 403s any upgrade
  # request without one of websockets/wsproto installed.
  "websockets>=13,<14",
]

[project.optional-dependencies]
test = ["pytest>=9,<10"]
# Only needed to actually RUN terminal-windows-node-agent on a real
# Windows node (windows_backend.py's real ConPTY process spawn) -- never
# imported at module level anywhere in this package (see windows_backend.
# py's own "lazy import" discipline), so this project installs and its
# test suite runs completely normally on Linux/macOS without it.
windows = ["pywinpty>=2,<3; sys_platform == 'win32'"]

[project.scripts]
terminal-mcp = "terminal_mcp.server:main"
terminal-mcp-http = "terminal_mcp.server_http:main"
terminal-mcp-webauth = "terminal_mcp.webauth_cli:main"
terminal-mcp-doctor = "terminal_mcp.doctor:main"
terminal-mcp-tunnel-watchdog = "terminal_mcp.tunnel_watchdog:main"
terminal-node-agent = "terminal_mcp.node_agent:main"
terminal-windows-node-agent = "terminal_mcp.windows_agent:main"

[tool.setuptools.packages.find]
include = ["terminal_mcp*"]

[tool.setuptools.package-data]
terminal_mcp = ["vendor/xterm/*"]

[tool.setuptools.dynamic]
version = {attr = "terminal_mcp.__version__"}

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -m \"not live_cli and not real_network\""
markers = [
  "live_cli: exercises a real, locally-installed Codex/Claude Code CLI binary in a disposable tmux session (real API calls, real cost/latency, not run by default -- see tests/test_adapters_real_cli.py). Run explicitly with `pytest -m live_cli`.",
  "real_network: performs a real DNS/TCP/TLS probe against a real external host (api.openai.com) -- not run by default so the suite stays deterministic on a host/CI runner without real internet access. Run explicitly with `pytest -m real_network`.",
]
